<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liam Orga">
<meta name="theme-color" content="#ffffff">
<title>Liam Orga</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👶</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body,#root{height:100%;width:100%;overflow:hidden}
body{font-family:'DM Sans',-apple-system,sans-serif;background:linear-gradient(180deg,#F8FAFC 0%,#EEF2FF 100%);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
input,button,select,textarea{font-family:inherit}button{cursor:pointer;-webkit-appearance:none}input:focus,textarea:focus,select:focus{outline:none}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:#F8FAFC}
/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:#fff;border-bottom:1px solid #E5E7EB;flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:8px}.hdr-t{font-size:17px;font-weight:800;color:#1E293B}.hdr-d{font-size:11px;color:#94A3B8}
.hdr-r{display:flex;align-items:center;gap:6px}
.sdot{width:7px;height:7px;border-radius:4px}.sdot.on{background:#059669}.sdot.off{background:#EF4444}
.hdr-s{font-size:12px;font-weight:700;color:#2563EB;background:#EFF6FF;padding:4px 8px;border-radius:16px}
.cnt{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:68px;-webkit-overflow-scrolling:touch}.vp{padding:12px 14px 20px}
/* Onboarding */
.ob{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:28px 22px;background:radial-gradient(circle at top,#DBEAFE,#EEF2FF 45%,#F8FAFC)}
.ob-l{font-size:52px}.ob-t{font-size:30px;font-weight:800;color:#0F172A}.ob-s{font-size:14px;color:#475569;margin:4px 0 20px}
.ob-shell{width:100%;max-width:360px;background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:18px;box-shadow:0 20px 35px rgba(15,23,42,.08)}
.ob-c{background:linear-gradient(180deg,#F8FAFC,#F1F5F9);border-radius:14px;padding:14px 16px;width:100%;box-shadow:inset 0 0 0 1px rgba(148,163,184,.2);margin-bottom:14px}
.ob-r{display:flex;align-items:center;gap:10px}.ob-r+.ob-r{margin-top:12px}.ob-i{font-size:24px}.ob-lb{font-size:13px;font-weight:700;color:#1E293B}.ob-tm{font-size:12px;color:#64748B}
.ob-nb{display:flex;gap:8px;margin-top:10px}
.ob-nbtn{flex:1;padding:14px 0;border-radius:10px;border:2px solid;font-size:15px;font-weight:700}
.ob-f{margin-bottom:10px}
.ob-fl{font-size:12px;font-weight:700;color:#475569;margin-bottom:5px;display:block}
.ob-fi{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #CBD5E1;font-size:14px;background:#fff}
.ob-h{font-size:11px;color:#94A3B8;margin:3px 2px 0}
.ob-go{background:linear-gradient(135deg,#1E293B,#334155);color:#fff;border:none;border-radius:12px;padding:13px 24px;font-size:15px;font-weight:700;margin-top:12px;width:100%}.ob-go:disabled{opacity:.45}
.ob-ftr{font-size:11px;text-align:center;color:#94A3B8;margin-top:10px}
/* Calendar */
.cal{margin-bottom:10px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-arr{border:none;background:none;font-size:20px;color:#2563EB;padding:4px 10px;font-weight:700}
.cal-label{font-size:12px;font-weight:700;color:#1E293B}
.cal-today{border:none;background:#EFF6FF;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;color:#2563EB;margin-left:6px}
.cal-days{display:flex;gap:3px}
.cal-d{flex:1;padding:8px 2px;border-radius:10px;border:none;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.cal-d.act{background:#2563EB;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.cal-d.today{border:2px solid #2563EB}
.cal-d .dn{font-size:11px;font-weight:600;color:#94A3B8}.cal-d.act .dn{color:rgba(255,255,255,.8)}
.cal-d .dnum{font-size:17px;font-weight:800;color:#1E293B}.cal-d.act .dnum{color:#fff}
/* Greeting */
.gc{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.gc-t{font-size:22px;font-weight:800;color:#1E293B}.gc-s{font-size:13px;color:#64748B;margin:3px 0 8px}
/* Gamification */
.gfc{background:linear-gradient(160deg,#F8FBFF,#ECF4FF 60%,#E0ECFF);border:1px solid #C7DBFF;border-radius:14px;padding:14px 15px;margin-bottom:12px;color:#0F172A;box-shadow:0 8px 20px rgba(37,99,235,.12)}
.gfh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gft{font-size:14px;font-weight:800}.gfp{font-size:12px;color:#1D4ED8;font-weight:800;background:#DBEAFE;border-radius:999px;padding:4px 8px}
.gfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.gfstat{background:#fff;border:1px solid #BFDBFE;border-radius:10px;padding:8px;text-align:center}
.gfnum{font-size:19px;font-weight:800}.gflb{font-size:10px;color:#64748B;font-weight:700}
.gfbar{height:8px;background:#DBEAFE;border-radius:999px;overflow:hidden;margin:6px 0 8px}
.gffill{height:100%;background:linear-gradient(90deg,#60A5FA,#22D3EE)}
.gfb{display:flex;gap:6px;flex-wrap:wrap}
.gfbd{font-size:10px;padding:3px 8px;border-radius:999px;background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A}
.gflink{width:100%;padding:10px;border-radius:10px;border:1px solid #BFDBFE;background:#EFF6FF;color:#1D4ED8;font-size:12px;font-weight:700}
.ginfo{background:#fff;border:1px solid #DBEAFE;border-radius:12px;padding:10px;margin-top:10px}
.ginfo-h{font-size:12px;font-weight:800;color:#1E3A8A;margin-bottom:6px}
.ginfo-l{font-size:11px;color:#334155;line-height:1.45;margin:3px 0}
.ginfo-strong{font-weight:700;color:#1E293B}
.praise-card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.praise-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.praise-btn{padding:10px 12px;border-radius:10px;border:1px solid #E5E7EB;background:#fff;font-size:13px;font-weight:700}
.praise-input{display:flex;gap:8px;margin-top:10px}
.praise-input input{flex:1;font-size:13px;padding:10px 12px;border-radius:10px;border:1px solid #E5E7EB;background:#fff}
.bal-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #F1F5F9}
.bal-row:last-child{border-bottom:none}
.bal-name{font-size:13px;font-weight:600;color:#1E293B}
.bal-score{font-size:12px;font-weight:700;color:#0F766E}
.bal-help{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:9px 10px;margin-top:8px;font-size:11px;color:#475569;line-height:1.45}
.bal-overview{background:linear-gradient(140deg,#F0FDFA,#ECFEFF);border:1px solid #99F6E4;border-radius:12px;padding:11px 12px;margin:8px 0}
.bal-overview-head{font-size:11px;font-weight:700;color:#0F766E;letter-spacing:.02em;text-transform:uppercase}
.bal-overview-val{font-size:18px;font-weight:800;color:#115E59;margin-top:2px}
.bal-overview-meta{font-size:12px;color:#0F766E;margin-top:4px}
.bal-bar{height:8px;background:#D1FAE5;border-radius:999px;overflow:hidden;margin-top:9px;display:flex}
.bal-bar-s{height:100%;background:#60A5FA}
.bal-bar-n{height:100%;background:#F472B6}
/* New messages banner */
.banner{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.banner:active{background:#DBEAFE}
.banner-dot{width:10px;height:10px;border-radius:5px;background:#2563EB;flex-shrink:0}
.banner-text{flex:1;font-size:14px;font-weight:600;color:#1D4ED8}
.banner-arrow{font-size:16px;color:#93C5FD}
/* Schedule */
.sbar{display:flex;align-items:center;justify-content:center;gap:5px;background:#1E293B;border-radius:8px;padding:6px 8px;margin-bottom:12px}
.sbar span{font-size:11px;color:#CBD5E1;font-weight:500}.sbar .ar{color:#475569}
/* Time section */
.tsec{margin-bottom:14px}.tsec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 2px}
.tsec-t{font-size:15px;font-weight:700;color:#1E293B;display:flex;align-items:center;gap:6px}
.tsec-c{font-size:13px;font-weight:600;color:#94A3B8}
/* Task card - clean, simple */
.tc{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:5px;box-shadow:0 1px 2px rgba(0,0,0,.02)}.tc.done{opacity:.4}
.tc-top{display:flex;align-items:center;gap:10px}
.ck{width:26px;height:26px;min-width:26px;border-radius:7px;border:2px solid #CBD5E1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:transparent}.ck.on{background:#059669;border-color:#059669;color:#fff}
.tc-c{flex:1;min-width:0;cursor:pointer}
.tc-t{font-size:15px;font-weight:500;color:#1E293B;line-height:1.3}
.tc-note{font-size:11px;color:#94A3B8;line-height:1.35;margin-top:3px;white-space:pre-wrap}
.tc-sub{display:flex;gap:5px;margin-top:4px;align-items:center}
.tc-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.plus-btn{border:none;background:#EFF6FF;color:#2563EB;border-radius:999px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.plus-btn:active{background:#DBEAFE}
.cbtn{border:none;background:#F8FAFC;border-radius:999px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#64748B;position:relative}
.cbtn:active{background:#E2E8F0}
.cbtn .ubg{position:absolute;top:-3px;right:-3px}
.bg{border-radius:5px;font-weight:600;padding:2px 6px;white-space:nowrap;font-size:10px}
.own-link{border:none;background:none;padding:0;font-size:12px;font-weight:600;cursor:pointer}
.tc-dot{width:10px;height:10px;border-radius:5px;flex-shrink:0}
/* Expanded task */
.tc-exp{padding-top:10px;margin-top:8px;border-top:1px solid #F1F5F9}
.tc-exp-own{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.own-btn{padding:8px 16px;border-radius:10px;border:1.5px solid #E5E7EB;font-size:14px;font-weight:600;background:#fff}
.own-btn.sel{border-width:2px}
/* Comments in expanded */
.cmt{margin-top:8px;padding-top:8px;border-top:1px dashed #E5E7EB}
.cmt-item{padding:8px 12px;border-radius:10px;margin-bottom:5px;font-size:13px;line-height:1.35}
.cmt-mine{background:#EFF6FF;color:#1D4ED8;margin-left:20px}
.cmt-theirs{background:#F1F5F9;color:#1E293B;margin-right:20px}
.cmt-info{font-size:10px;color:#94A3B8;margin-top:1px}
.cmt-input{display:flex;gap:6px;margin-top:6px}
.cmt-input input{flex:1;font-size:14px;padding:10px 14px;border-radius:18px;border:1px solid #E5E7EB}
.cmt-input button{background:#2563EB;color:#fff;border:none;border-radius:20px;width:38px;height:38px;font-size:16px;font-weight:700}
/* Unread badge */
.ubg{background:#EF4444;color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 3px}
/* Progress */
.pr{display:flex;align-items:center;gap:5px}.pr-bg{flex:1;height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden}
.pr-f{height:100%;border-radius:inherit;transition:width .4s}.pr-t{font-size:9px;font-weight:700;color:#94A3B8;min-width:24px;text-align:right}
/* ML */
.mlc{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.03)}.ml-t{font-size:13px;font-weight:700;color:#1E293B;margin-bottom:8px}
.ml-s{display:flex;gap:6px}.ml-si{flex:1;text-align:center}.ml-n{font-size:20px;font-weight:800}.ml-l{font-size:10px;color:#94A3B8;font-weight:600}
/* Person */
.ptabs{display:flex;gap:6px;margin-bottom:14px}.ptab{flex:1;padding:12px 0;border-radius:10px;border:2px solid;font-size:15px;font-weight:700}
.pch{display:flex;align-items:center;gap:5px;padding:12px 0 4px;font-size:12px;font-weight:700}.pcc{font-size:10px;color:#94A3B8;font-weight:600;margin-left:auto}
/* Chat */
.chtb{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:10px;border:none;background:#fff;margin-bottom:4px;box-shadow:0 1px 2px rgba(0,0,0,.02);font-family:inherit;text-align:left}
.chtb:active{background:#F8FAFC}
.th{padding:10px 14px;border-bottom:1px solid #E5E7EB;background:#fff;display:flex;align-items:center;gap:8px}
.th-bk{border:none;background:none;font-size:20px;color:#2563EB;padding:4px}
.tmsgs{flex:1;overflow-y:auto;padding:10px 14px}
.mb{padding:10px 14px;border-radius:14px;margin-top:8px;max-width:85%;font-size:14px;line-height:1.35}
.mb.mine{background:#2563EB;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.mb.theirs{background:#F1F5F9;color:#1E293B;margin-right:auto;border-bottom-left-radius:4px}
.mb .mbi{font-size:9px;margin-top:2px;opacity:.6}
.mib{display:flex;gap:6px;padding:10px 14px;background:#fff;border-top:1px solid #F1F5F9}
.mib input{flex:1;font-size:15px;padding:12px 16px;border-radius:20px;border:1px solid #E5E7EB}
.mib button{background:#2563EB;color:#fff;border:none;border-radius:22px;width:44px;height:44px;font-size:18px;font-weight:700}
/* Library */
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.lt{font-size:17px;font-weight:700;color:#1E293B}
.la{background:#2563EB;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700}
.ls{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:15px;margin-bottom:10px;background:#fff}
.li{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:4px;box-shadow:0 1px 1px rgba(0,0,0,.02);display:flex;align-items:center;gap:8px}
.li-c{flex:1;min-width:0}.li-t{font-size:14px;font-weight:500;color:#1E293B}.li-m{font-size:10px;color:#94A3B8;margin-top:2px}
.lib{width:30px;height:30px;border-radius:7px;border:1px solid #E5E7EB;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.libd{border-color:#FEE2E2;background:#FEF2F2}
/* Checkin */
.cic{background:#fff;border-radius:14px;padding:18px 16px;box-shadow:0 2px 6px rgba(0,0,0,.04)}.ci-t{font-size:19px;font-weight:800;color:#1E293B;margin-bottom:3px}.ci-s{font-size:13px;color:#64748B;margin-bottom:14px}
.ci-q{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #F1F5F9}.ci-q:last-of-type{border-bottom:none}
.ci-n{width:22px;height:22px;min-width:22px;border-radius:6px;background:#EEF2FF;color:#4338CA;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ci-tx{font-size:14px;color:#1E293B;line-height:1.4;font-weight:500}
/* Celebration */
.cel{text-align:center;padding:12px;background:linear-gradient(135deg,#F0FDF4,#ECFDF5);border-radius:10px;margin-bottom:8px}.cel-e{font-size:28px}.cel-t{font-size:12px;font-weight:700;color:#059669}
/* Modal */
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;padding:20px 18px 28px;animation:su .2s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.md-t{font-size:18px;font-weight:800;color:#1E293B;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.md-x{width:30px;height:30px;border-radius:7px;border:1px solid #E5E7EB;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.fg{margin-bottom:12px}.fl{font-size:12px;font-weight:700;color:#64748B;margin-bottom:3px;display:block}
.fi{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #E5E7EB;font-size:15px;background:#fff}
.fta{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #E5E7EB;font-size:15px;min-height:50px;resize:vertical;background:#fff}
.fse{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #E5E7EB;font-size:15px;background:#fff}
.fr{display:flex;gap:6px}
.fsub{width:100%;padding:14px;border-radius:12px;border:none;background:#1E293B;color:#fff;font-size:16px;font-weight:700;margin-top:6px}
.fdel{width:100%;padding:10px;border-radius:10px;border:1px solid #FEE2E2;background:#FEF2F2;color:#DC2626;font-size:13px;font-weight:600;margin-top:6px}
/* Assign */
.asp{display:flex;gap:8px;margin-bottom:14px}
.aspp{flex:1;padding:14px 0;border-radius:10px;border:2px solid #E5E7EB;font-size:14px;font-weight:700;text-align:center}
.asc{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.asb{padding:10px 14px;border-radius:10px;border:1.5px solid #E5E7EB;background:#fff;font-size:13px;font-weight:600;color:#1E293B;text-align:left;display:flex;align-items:center;justify-content:space-between}
.asb.sel{border-color:#2563EB;background:#EFF6FF;color:#2563EB}.ash{font-size:11px;color:#94A3B8;font-weight:400}
.assv{width:100%;padding:12px;border-radius:10px;border:none;background:#1E293B;color:#fff;font-size:14px;font-weight:700}

/* Antonella */
.acard{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.atitle{font-size:15px;font-weight:800;color:#1E293B;margin-bottom:8px}
.asub{font-size:12px;color:#64748B}
.agrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.adow{font-size:10px;font-weight:700;color:#94A3B8;text-align:center;padding:2px 0}
.aday{border:none;border-radius:8px;background:#fff;padding:8px 0;font-size:12px;font-weight:700;color:#1E293B;border:1px solid #E5E7EB}
.aday.muted{opacity:.35}
.aday.sel{background:#2563EB;color:#fff;border-color:#2563EB}
.aday.has{border-color:#10B981;background:#ECFDF5;color:#047857}
.aday.sel.has{background:#1D4ED8;color:#fff;border-color:#1D4ED8}
.arow{display:flex;gap:8px;align-items:end}
/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid #E5E7EB;padding:3px 4px;padding-bottom:max(4px,env(safe-area-inset-bottom));z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;border:none;background:none;border-radius:8px;position:relative}.nb.act{background:#EFF6FF}
.ni{font-size:19px}.nl{font-size:10px;font-weight:500;color:#94A3B8}.nb.act .nl{font-weight:700;color:#2563EB}
.nbg{position:absolute;top:1px;right:calc(50% - 16px);background:#EF4444;color:#fff;font-size:8px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.new-pill{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;border-radius:999px;background:#DBEAFE;color:#1D4ED8;font-size:10px;font-weight:700;margin-left:6px}

function moveTask(tid,dir){

  var sections=[sm.m,sm.mid,sm.a,sm.e,sm.d,sm.o];
  var sec=null;
  for(var s=0;s<sections.length;s++){
    for(var j=0;j<sections[s].length;j++){
      if(sections[s][j].id===tid){sec=sections[s];break}
    }
    if(sec)break;
  }
  if(!sec)return;
  var secIds=sec.map(function(t){return t.id});
  var idx=secIds.indexOf(tid);
  if(idx<0)return;
  var newIdx=idx+dir;
  if(newIdx<0||newIdx>=secIds.length)return;
  // Get the two task ids to swap
  var idA=secIds[idx];var idB=secIds[newIdx];
  // Build full order
  var order=tOrd.length>0?tOrd.slice():tl.map(function(t){return t.id});
  tl.forEach(function(t){if(order.indexOf(t.id)<0)order.push(t.id)});

  var posA=order.indexOf(idA);var posB=order.indexOf(idB);
  if(posA<0||posB<0)return;
  order[posA]=idB;order[posB]=idA;
  setTOrd(order);
  db.collection("v2").doc("tOrd").set({o:order});
}
